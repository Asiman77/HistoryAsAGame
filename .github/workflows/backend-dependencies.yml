name: Backend dependencies

# OWASP Dependency-Check (BACKEND_SPEC §13): fails on a known vulnerability with CVSS >= 7.
# Separate from backend.yml: it needs the NVD database, and new CVEs appear without any
# change here, so it also runs weekly.
on:
  push:
    branches: [main]
    paths: ["backend/pom.xml", "backend/dependency-check-suppressions.xml", ".github/workflows/backend-dependencies.yml"]
  pull_request:
    paths: ["backend/pom.xml", "backend/dependency-check-suppressions.xml", ".github/workflows/backend-dependencies.yml"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # The NVD mirror (~ several hundred MB) is updated incrementally; restore the last one.
      - name: Restore NVD data
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      # Repository secret NVD_API_KEY is required (free: https://nvd.nist.gov/developers/request-an-api-key).
      # Without a key the plugin fails ("Invalid apiKey") and NVD throttles keyless downloads.
      - run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::Add the NVD_API_KEY repository secret (https://nvd.nist.gov/developers/request-an-api-key)."
            exit 1
          fi
          ./mvnw -B dependency-check:check -DnvdApiKey="$NVD_API_KEY"
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.*
          if-no-files-found: ignore
