# Shared defaults. No secrets and no environment-specific values here: they come from
# environment variables (Spring relaxed binding), e.g. SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD. See docker/.env.example.
spring:
  application:
    name: tarix-platform
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false        # Flyway owns the schema (V002)
      completion-mode: archive
      republish-outstanding-events-on-restart: true
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,application/geo+json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith
  endpoint:
    health:
      probes:
        enabled: true

# Secrets only from the environment; startup fails without JWT_SECRET (see docker/.env.example).
platform:
  identity:
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 14d
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
      display-name: ${ADMIN_DISPLAY_NAME:Administrator}
  # Failed projections stay in the event registry and are resubmitted (BACKEND_SPEC.md §9.7).
  publishing:
    retry-interval: 1m     # how often incomplete event publications are resubmitted
    retry-after: 1m        # only those older than this (younger ones may still be running)
  # The frontend's data/ folder for POST /api/v1/admin/import (ADR-0013). Defaults fit running
  # from backend/ in the repository; docker/docker-compose.yml mounts the folders read-only.
  import:
    data-dir: ${IMPORT_DATA_DIR:../data}
    built-territories-dir: ${IMPORT_BUILT_TERRITORIES_DIR:../public/data/territories}
  # Browser origins allowed to call the API, comma-separated (BACKEND_SPEC.md §13). Empty: none.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
