# Local stack: PostgreSQL + PostGIS, S3-compatible storage, backend.
#   cp docker/.env.example docker/.env   # fill in passwords
#   docker compose -f docker/docker-compose.yml up --build
name: tarix

services:
  db:
    image: postgis/postgis:18-3.7          # keep in sync with backend/pom.xml <postgis.image>
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in docker/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set in docker/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in docker/.env}
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:4.50        # MinIO CE images are discontinued, see docs/adr/0008
    entrypoint: ["/bin/sh", "/init/s3-entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in docker/.env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in docker/.env}
    volumes:
      - ./init:/init:ro
      - s3-data:/data
    ports:
      - "127.0.0.1:8333:8333"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30

  s3-init:
    image: chrislusf/seaweedfs:4.50
    entrypoint: ["/bin/sh", "/init/s3-buckets.sh"]
    environment:
      SEAWEED_MASTER: s3:9333
    volumes:
      - ./init:/init:ro
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ../backend
      additional_contexts:
        shared-schema: ../shared/schema
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set in docker/.env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      S3_ENDPOINT: http://s3:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      IMPORT_DATA_DIR: /import/data
      IMPORT_BUILT_TERRITORIES_DIR: /import/territories
    volumes:
      # Source of POST /api/v1/admin/import (docs/adr/0013); read-only.
      - ../data:/import/data:ro
      - ../public/data/territories:/import/territories:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      # The JRE image has no curl/wget; bash's /dev/tcp is enough for a liveness probe.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/liveness HTTP/1.0\r\n\r\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

volumes:
  db-data:
  s3-data:
